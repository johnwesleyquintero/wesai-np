<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WesCore | AI-Powered Workflow & Knowledge Platform</title>

    <!-- Primary Meta Tags -->
    <meta name="description" content="The operator-first platform for building, executing, and automating high-value workflows. Powered by a modular AI engine and real-time cloud sync." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://wescore.app/">
    <meta property="og:title" content="WesCore | AI-Powered Workflow & Knowledge Platform">
    <meta property="og:description" content="The operator-first platform for building, executing, and automating high-value workflows. Powered by a modular AI engine and real-time cloud sync.">
    <meta property="og:image" content="https://wescore.app/favicon.svg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://wescore.app/">
    <meta property="twitter:title" content="WesCore | AI-Powered Workflow & Knowledge Platform">
    <meta property="twitter:description" content="The operator-first platform for building, executing, and automating high-value workflows. Powered by a modular AI engine and real-time cloud sync.">
    <meta property="twitter:image" content="https://wescore.app/favicon.svg">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme Color for PWA -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">

    <!-- Apple PWA specific tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WesCore">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              light: {
                background: '#ffffff', // Pure white
                text: '#18181b',       // Zinc-950
                ui: '#f4f4f5',         // Zinc-100
                'ui-hover': '#e4e4e7', // Zinc-200
                primary: '#18181b',    // Zinc-950 (Black)
                'primary-hover': '#3f3f46', // Zinc-700
                border: '#e4e4e7'      // Zinc-200
              },
              dark: {
                background: '#09090b',   // Zinc-950 (Deep Black)
                text: '#fafafa',         // Zinc-50
                ui: '#18181b',           // Zinc-900
                'ui-hover': '#27272a',   // Zinc-800
                primary: '#fafafa',      // Zinc-50 (White)
                'primary-hover': '#d4d4d8', // Zinc-300
                border: '#27272a'       // Zinc-800
              }
            }
          }
        }
      }
    </script>
  <link rel="stylesheet" href="/styles.css">
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.25.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm",
    "react-markdown": "https://esm.sh/react-markdown@9?deps=react@19",
    "remark-gfm": "https://esm.sh/remark-gfm@4?deps=react@19",
    "rehype-raw": "https://esm.sh/rehype-raw@7?deps=react@19",
    "react-syntax-highlighter/": "https://esm.sh/react-syntax-highlighter@15.5.0/",
    "react-syntax-highlighter": "https://esm.sh/react-syntax-highlighter@15.5.0?deps=react@19",
    "react-force-graph-2d": "https://esm.sh/react-force-graph-2d@1.23.11?deps=react@19",
    "three": "https://esm.sh/three@0.129.0"
  }
}
</script>
</head>
  <body class="bg-light-background dark:bg-dark-background">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
